<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <meta name="description" content="A typed expense tracker with filters, a category chart and CSV export." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="dist/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Expense Tracker</h1>
      </div>
      <div class="filters">
        <select id="filter-month" aria-label="Filter by month"></select>
        <select id="filter-category" aria-label="Filter by category"></select>
        <button id="export" type="button" class="ghost">Export CSV</button>
      </div>
    </header>

    <section class="cards" aria-label="Totals">
      <article class="card"><span>Income</span><strong id="total-income">$0.00</strong></article>
      <article class="card"><span>Spent</span><strong id="total-expense">$0.00</strong></article>
      <article class="card card--accent"><span>Balance</span><strong id="total-balance">$0.00</strong></article>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Add transaction</h2>
        <form id="tx-form" novalidate>
          <div class="kind" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="kind" value="expense" checked /><span>Expense</span></label>
            <label><input type="radio" name="kind" value="income" /><span>Income</span></label>
          </div>
          <label class="field">Description
            <input id="description" type="text" maxlength="60" placeholder="e.g. Groceries" autocomplete="off" />
          </label>
          <div class="row">
            <label class="field">Amount
              <input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" />
            </label>
            <label class="field">Date
              <input id="date" type="date" />
            </label>
          </div>
          <label class="field">Category
            <select id="category"></select>
          </label>
          <p id="form-error" class="error" role="alert"></p>
          <button type="submit" class="primary">Add</button>
        </form>
      </section>

      <section class="panel">
        <h2>Where it went</h2>
        <div class="chart">
          <canvas id="donut" width="220" height="220" role="img" aria-label="Spending by category"></canvas>
          <ul id="legend" class="legend"></ul>
        </div>
      </section>

      <section class="panel panel--wide">
        <h2>Transactions</h2>
        <ul id="tx-list" class="tx-list"></ul>
        <div id="empty" class="empty">
          <p>No transactions here yet.</p>
          <button id="load-sample" type="button" class="ghost">Load sample data</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
