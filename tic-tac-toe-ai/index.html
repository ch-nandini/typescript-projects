<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe AI</title>
  <meta name="description" content="Tic-tac-toe against an unbeatable minimax AI, written in TypeScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="dist/main.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>Tic-Tac-Toe <span>AI</span></h1>
      <p class="sub">Minimax with alpha-beta pruning. On “Impossible” the best you can do is draw.</p>
    </header>

    <section class="controls" aria-label="Game settings">
      <fieldset class="segmented">
        <legend>Difficulty</legend>
        <label><input type="radio" name="difficulty" value="easy" /> <span>Easy</span></label>
        <label><input type="radio" name="difficulty" value="medium" /> <span>Medium</span></label>
        <label><input type="radio" name="difficulty" value="impossible" checked /> <span>Impossible</span></label>
      </fieldset>
      <fieldset class="segmented">
        <legend>You play</legend>
        <label><input type="radio" name="side" value="X" checked /> <span>X (first)</span></label>
        <label><input type="radio" name="side" value="O" /> <span>O</span></label>
      </fieldset>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board"></div>

    <section class="scoreboard" aria-label="Score">
      <div><strong id="score-wins">0</strong><span>Wins</span></div>
      <div><strong id="score-draws">0</strong><span>Draws</span></div>
      <div><strong id="score-losses">0</strong><span>Losses</span></div>
    </section>

    <div class="actions">
      <button id="new-game" class="primary" type="button">New game</button>
      <button id="reset-score" class="ghost" type="button">Reset score</button>
    </div>
  </main>
</body>
</html>
